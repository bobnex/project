<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Juvora Project Code Replacer</title>
  <style>
    :root {
      --bg: #090a0f;
      --surface: #12151f;
      --surface-border: #23293b;
      --accent: #d4af37;
      --accent-glow: rgba(212, 175, 55, 0.25);
      --accent-hover: #f3cf58;
      --text: #f0f3fa;
      --text-muted: #8b95a8;
      --success: #10b981;
      --danger: #ef4444;
      --info: #3b82f6;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    /* Top Navigation Header */
    header {
      background: var(--surface);
      border-bottom: 1px solid var(--surface-border);
      padding: 12px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-shrink: 0;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-logo {
      width: 28px;
      height: 28px;
      border-radius: 6px;
      background: linear-gradient(135deg, #d4af37, #aa820a);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      color: #000;
      font-size: 15px;
      box-shadow: 0 0 12px var(--accent-glow);
    }

    .brand h1 {
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    .brand span {
      color: var(--accent);
      font-weight: 400;
      font-size: 12px;
      margin-left: 6px;
      border: 1px solid rgba(212, 175, 55, 0.4);
      padding: 2px 6px;
      border-radius: 12px;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .btn {
      background: var(--surface-border);
      color: var(--text);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 8px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
    }

    .btn:hover {
      background: #2a3147;
      border-color: rgba(255, 255, 255, 0.2);
    }

    .btn-gold {
      background: linear-gradient(135deg, #d4af37, #b8860b);
      color: #0b0c10;
      border: none;
      box-shadow: 0 2px 10px var(--accent-glow);
    }

    .btn-gold:hover {
      background: linear-gradient(135deg, #f3cf58, #d4af37);
      transform: translateY(-1px);
    }

    .status-badge {
      font-size: 12px;
      padding: 4px 10px;
      border-radius: 20px;
      background: rgba(239, 68, 68, 0.15);
      color: #fca5a5;
      border: 1px solid rgba(239, 68, 68, 0.3);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .status-badge.connected {
      background: rgba(16, 185, 129, 0.15);
      color: #6ee7b7;
      border-color: rgba(16, 185, 129, 0.3);
    }

    /* Main Container Layout */
    .workspace {
      display: flex;
      flex: 1;
      height: calc(100vh - 58px);
      overflow: hidden;
    }

    /* Sidebar Pages Explorer */
    .sidebar {
      width: 320px;
      background: #0d0f17;
      border-right: 1px solid var(--surface-border);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
    }

    .search-box {
      padding: 12px;
      border-bottom: 1px solid var(--surface-border);
    }

    .search-input {
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--surface-border);
      color: var(--text);
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 13px;
      outline: none;
    }

    .search-input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 8px var(--accent-glow);
    }

    .file-tree {
      flex: 1;
      overflow-y: auto;
      padding: 8px;
    }

    .category-title {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      color: var(--accent);
      padding: 10px 8px 4px 8px;
      letter-spacing: 0.8px;
    }

    .file-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 7px 10px;
      border-radius: 6px;
      font-size: 13px;
      color: var(--text-muted);
      cursor: pointer;
      user-select: none;
      transition: all 0.15s ease;
      margin-bottom: 2px;
    }

    .file-item:hover {
      background: rgba(255, 255, 255, 0.05);
      color: var(--text);
    }

    .file-item.active {
      background: rgba(212, 175, 55, 0.12);
      color: #fff;
      font-weight: 600;
      border-left: 3px solid var(--accent);
    }

    .file-item .file-label {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .file-item .file-ext {
      font-size: 10px;
      color: #64748b;
      padding: 2px 4px;
      border-radius: 3px;
      background: #181d2a;
    }

    /* Editor Canvas */
    .editor-pane {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: #090a0f;
    }

    .editor-toolbar {
      background: var(--surface);
      border-bottom: 1px solid var(--surface-border);
      padding: 10px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .current-file-info {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .current-path {
      font-family: monospace;
      font-size: 13px;
      background: #090a0f;
      padding: 4px 10px;
      border-radius: 4px;
      border: 1px solid var(--surface-border);
      color: #93c5fd;
    }

    .editor-stats {
      font-size: 12px;
      color: var(--text-muted);
    }

    .editor-container {
      flex: 1;
      position: relative;
      display: flex;
    }

    .code-area {
      flex: 1;
      width: 100%;
      height: 100%;
      background: #090b11;
      color: #e2e8f0;
      font-family: "JetBrains Mono", Consolas, "Courier New", monospace;
      font-size: 13.5px;
      line-height: 1.55;
      padding: 16px;
      border: none;
      resize: none;
      outline: none;
      white-space: pre;
      overflow-wrap: normal;
      overflow: auto;
      tab-size: 2;
    }

    .code-area::placeholder {
      color: #475569;
      font-style: italic;
    }

    /* Toast Notification */
    .toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: #1e2538;
      border: 1px solid var(--accent);
      color: #fff;
      padding: 12px 18px;
      border-radius: 8px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
      font-size: 13px;
      display: none;
      align-items: center;
      gap: 8px;
      z-index: 999;
      animation: slideUp 0.25s ease;
    }

    @keyframes slideUp {
      from { transform: translateY(20px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
  </style>
</head>
<body>

  <!-- Top Application Bar -->
  <header>
    <div class="brand">
      <div class="brand-logo">J</div>
      <h1>Juvora Quick Replacer</h1>
      <span>NO LOGIN REQUIRED</span>
    </div>

    <div class="header-actions">
      <div id="connectionStatus" class="status-badge">
        <span>●</span> Folder Not Connected
      </div>
      <button class="btn" id="connectDirBtn" title="Directly link to your local project folder">
        📁 Connect Project Folder
      </button>
      <button class="btn" id="revertBtn" title="Revert to prior backup">
        ↺ Revert Last
      </button>
      <button class="btn" id="copyBtn" title="Copy editor content to clipboard">
        📋 Copy
      </button>
      <button class="btn" id="downloadBtn" title="Download as single file">
        ⬇ Download File
      </button>
      <button class="btn btn-gold" id="saveDiskBtn" title="Save replacement code directly to disk">
        ⚡ Save & Overwrite File
      </button>
    </div>
  </header>

  <!-- Workspace Container -->
  <div class="workspace">

    <!-- Left Explorer Sidebar -->
    <aside class="sidebar">
      <div class="search-box">
        <input 
          type="text" 
          id="searchInput" 
          class="search-input" 
          placeholder="Filter pages or files... (e.g. admin, clans)" 
        />
      </div>
      <div class="file-tree" id="fileTreeContainer">
        <!-- Rendered by JavaScript -->
      </div>
    </aside>

    <!-- Editor Main Pane -->
    <main class="editor-pane">
      <div class="editor-toolbar">
        <div class="current-file-info">
          <span style="font-size: 13px; font-weight: 600;">Editing:</span>
          <span class="current-path" id="currentFilePath">Select a page on the left</span>
          <button class="btn" id="pasteBtn" style="padding: 4px 8px; font-size: 11px;">
            📋 Paste Replacement Code
          </button>
          <button class="btn" id="clearBtn" style="padding: 4px 8px; font-size: 11px;">
            ✖ Clear
          </button>
        </div>
        <div class="editor-stats" id="editorStats">Lines: 0 | Chars: 0</div>
      </div>

      <div class="editor-container">
        <textarea 
          id="codeEditor" 
          class="code-area" 
          placeholder="Select any page from the sidebar on the left, then paste the full replacement code here. When done, click '⚡ Save & Overwrite File' or 'Download File'!"
        ></textarea>
      </div>
    </main>

  </div>

  <div id="toast" class="toast">Action performed successfully</div>

  <script>
    // All Pages & Files of the Juvora Project
    const PROJECT_FILES = [
      {
        category: "🚀 Main Pages & Routes",
        files: [
          { name: "Welcome / Landing", path: "src/routes/index.tsx" },
          { name: "Player Dashboard", path: "src/routes/_player.home.tsx" },
          { name: "Quick Battle Setup", path: "src/routes/_player.battle.tsx" },
          { name: "Duel Arena (Match Page)", path: "src/routes/_player.match.$matchId.tsx" },
          { name: "Ghost Rivals Arena", path: "src/routes/_player.ghost.tsx" },
          { name: "Match Review", path: "src/routes/_player.review.$matchId.tsx" },
          { name: "Courses Browser", path: "src/routes/_player.courses.tsx" },
          { name: "Friends & Social", path: "src/routes/_player.friends.tsx" },
          { name: "Player Settings", path: "src/routes/_player.settings.tsx" },
          { name: "Help Center", path: "src/routes/_player.help.tsx" },
          { name: "Notifications", path: "src/routes/_player.notifications.tsx" }
        ]
      },
      {
        category: "🛡️ Clans & Clan Wars",
        files: [
          { name: "Clans Hub & War Arena", path: "src/routes/_player.clans.tsx" },
          { name: "Clan War Room & Settlement", path: "src/routes/_player.clan-war.$challengeId.tsx" },
          { name: "Clan Invite Listener", path: "src/components/game/ClanWarInviteListener.tsx" },
          { name: "Clan War Rules & Settlement", path: "src/lib/clan-war.ts" },
          { name: "Clan Store & Hooks", path: "src/lib/clans-store.ts" },
          { name: "Clan Definitions & Rules", path: "src/lib/clans.ts" }
        ]
      },
      {
        category: "🏆 Tournaments & Rankings",
        files: [
          { name: "Tournaments Hub", path: "src/routes/_player.tournaments.index.tsx" },
          { name: "Tournament Live & Bracket", path: "src/routes/_player.tournaments.$tournamentId.tsx" },
          { name: "Tournament Extras & Podium", path: "src/components/game/tournament-extras.tsx" },
          { name: "Rankings & Seasons Page", path: "src/routes/_player.rankings.tsx" },
          { name: "Ranked Math & Seasons Logic", path: "src/lib/ranked.ts" },
          { name: "Ranked Firestore Store", path: "src/lib/ranked-store.ts" }
        ]
      },
      {
        category: "🛍️ Shop, Cosmetics & Profile",
        files: [
          { name: "Shop Route", path: "src/routes/_player.shop.tsx" },
          { name: "Cosmetics Shop Component", path: "src/components/game/CosmeticsShop.tsx" },
          { name: "Cosmetic Preview Dialog", path: "src/components/game/CosmeticPreview.tsx" },
          { name: "Cosmetics Catalog Data", path: "src/lib/cosmetics.ts" },
          { name: "Cosmetics Store & Wallet", path: "src/lib/cosmetics-store.ts" },
          { name: "Player Profile Page", path: "src/routes/_player.profile.tsx" }
        ]
      },
      {
        category: "⚙️ Admin & Authentication",
        files: [
          { name: "Admin Dashboard Page", path: "src/routes/_player.admin.tsx" },
          { name: "Cosmetics Admin Panel", path: "src/components/game/CosmeticsAdmin.tsx" },
          { name: "Login Page", path: "src/routes/login.tsx" },
          { name: "Sign Up (Free Reg Toggle)", path: "src/routes/signup.tsx" },
          { name: "Forgot Password", path: "src/routes/forgot-password.tsx" },
          { name: "Payment & Free Reg Rules", path: "src/lib/payment.ts" }
        ]
      },
      {
        category: "🎨 Theme, Layout & Shell",
        files: [
          { name: "Styles & Global Themes (Goldy)", path: "src/styles.css" },
          { name: "Root Shell (__root.tsx)", path: "src/routes/__root.tsx" },
          { name: "Player Shell Layout", path: "src/routes/_player.tsx" },
          { name: "AppShell & Bottom Nav", path: "src/components/game/AppShell.tsx" },
          { name: "Themes Definition", path: "src/lib/themes.ts" }
        ]
      },
      {
        category: "🧠 Core Logic & Engines",
        files: [
          { name: "App Context & Admin Emails", path: "src/lib/app-context.tsx" },
          { name: "Game Engine & Matchmaking", path: "src/lib/engine.ts" },
          { name: "Subjects & Courses", path: "src/lib/subjects.ts" },
          { name: "Battle Card Generator", path: "src/lib/shareable-battle-card.ts" },
          { name: "Voice Chat Mesh", path: "src/lib/voice-session.ts" }
        ]
      }
    ];

    let currentFile = null;
    let directoryHandle = null;

    const fileTreeContainer = document.getElementById("fileTreeContainer");
    const searchInput = document.getElementById("searchInput");
    const currentFilePath = document.getElementById("currentFilePath");
    const codeEditor = document.getElementById("codeEditor");
    const editorStats = document.getElementById("editorStats");
    const connectionStatus = document.getElementById("connectionStatus");
    const toast = document.getElementById("toast");

    // Show floating toast
    function showToast(message, isError = false) {
      toast.textContent = message;
      toast.style.borderColor = isError ? "var(--danger)" : "var(--accent)";
      toast.style.display = "flex";
      setTimeout(() => {
        toast.style.display = "none";
      }, 3500);
    }

    // Render all files into sidebar
    function renderFileTree(filter = "") {
      fileTreeContainer.innerHTML = "";
      const query = filter.toLowerCase().trim();

      PROJECT_FILES.forEach(section => {
        const matching = section.files.filter(f => 
          f.name.toLowerCase().includes(query) || f.path.toLowerCase().includes(query)
        );

        if (matching.length === 0) return;

        const catTitle = document.createElement("div");
        catTitle.className = "category-title";
        catTitle.textContent = section.category;
        fileTreeContainer.appendChild(catTitle);

        matching.forEach(file => {
          const item = document.createElement("div");
          item.className = "file-item" + (currentFile && currentFile.path === file.path ? " active" : "");
          item.onclick = () => selectFile(file);

          const ext = file.path.split('.').pop();
          item.innerHTML = `
            <span class="file-label" title="${file.path}">${file.name}</span>
            <span class="file-ext">${ext}</span>
          `;
          fileTreeContainer.appendChild(item);
        });
      });
    }

    // Select a file to edit
    async function selectFile(file) {
      currentFile = file;
      currentFilePath.textContent = file.path;
      renderFileTree(searchInput.value);

      // Try reading directly from connected directory if available
      if (directoryHandle) {
        try {
          const content = await readFileFromDisk(file.path);
          if (content !== null) {
            codeEditor.value = content;
            updateStats();
            showToast(`Loaded ${file.name} from project folder`);
            return;
          }
        } catch (e) {
          console.warn("Could not read file from disk handle:", e);
        }
      }

      // Check if previously saved in local backup
      const saved = localStorage.getItem("code_backup_" + file.path);
      if (saved) {
        codeEditor.value = saved;
        showToast(`Loaded cached version for ${file.name}`);
      } else {
        codeEditor.value = "";
        codeEditor.placeholder = `Ready to replace ${file.path}.\nPaste your full replacement code here and click "⚡ Save & Overwrite File".`;
      }
      updateStats();
    }

    // Update lines/chars counter
    function updateStats() {
      const text = codeEditor.value;
      const lines = text ? text.split("\n").length : 0;
      const chars = text.length;
      editorStats.textContent = `Lines: ${lines.toLocaleString()} | Chars: ${chars.toLocaleString()}`;
    }

    codeEditor.addEventListener("input", updateStats);
    searchInput.addEventListener("input", (e) => renderFileTree(e.target.value));

    // Connect Project Folder via HTML5 File System Access API
    document.getElementById("connectDirBtn").addEventListener("click", async () => {
      if (!("showDirectoryPicker" in window)) {
        showToast("Your browser does not support folder access. Use Chrome, Edge, or Brave.", true);
        return;
      }
      try {
        directoryHandle = await window.showDirectoryPicker({ mode: "readwrite" });
        connectionStatus.className = "status-badge connected";
        connectionStatus.innerHTML = `<span>●</span> Connected: ${directoryHandle.name}`;
        showToast("Connected to project folder!");

        if (currentFile) {
          selectFile(currentFile);
        }
      } catch (err) {
        if (err.name !== "AbortError") {
          showToast("Failed to connect folder: " + err.message, true);
        }
      }
    });

    // Helper: Traverse and get nested file handle
    async function getNestedFileHandle(dirHandle, pathSegments, create = false) {
      let currentDir = dirHandle;
      for (let i = 0; i < pathSegments.length - 1; i++) {
        currentDir = await currentDir.getDirectoryHandle(pathSegments[i], { create });
      }
      return await currentDir.getFileHandle(pathSegments[pathSegments.length - 1], { create });
    }

    // Helper: Read file directly from disk
    async function readFileFromDisk(relativePath) {
      if (!directoryHandle) return null;
      const parts = relativePath.split('/');
      const fileHandle = await getNestedFileHandle(directoryHandle, parts, false);
      const file = await fileHandle.getFile();
      return await file.text();
    }

    // Save & Overwrite directly to disk
    document.getElementById("saveDiskBtn").addEventListener("click", async () => {
      if (!currentFile) {
        showToast("Please pick a file on the left first!", true);
        return;
      }

      const code = codeEditor.value;
      if (!code.trim()) {
        showToast("Editor is empty. Paste code before saving!", true);
        return;
      }

      // Save a local safety backup first
      localStorage.setItem("code_backup_" + currentFile.path, code);

      if (directoryHandle) {
        try {
          const parts = currentFile.path.split('/');
          const fileHandle = await getNestedFileHandle(directoryHandle, parts, true);
          const writable = await fileHandle.createWritable();
          await writable.write(code);
          await writable.close();
          showToast(`⚡ Successfully overwritten: ${currentFile.path}`);
        } catch (err) {
          showToast("Disk write error: " + err.message, true);
        }
      } else {
        // Fallback: If folder not connected, download the file
        downloadFile(currentFile.path, code);
        showToast(`Saved to backup & downloaded ${currentFile.path.split('/').pop()}! Connect folder for direct overwrites.`);
      }
    });

    // Fallback Download button
    function downloadFile(filename, content) {
      const blob = new Blob([content], { type: "text/plain;charset=utf-8" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = filename.split('/').pop();
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(a.href);
    }

    document.getElementById("downloadBtn").addEventListener("click", () => {
      if (!currentFile) {
        showToast("Pick a file first!", true);
        return;
      }
      downloadFile(currentFile.path, codeEditor.value);
      showToast(`Downloaded ${currentFile.path.split('/').pop()}`);
    });

    // Copy to clipboard
    document.getElementById("copyBtn").addEventListener("click", async () => {
      if (!codeEditor.value) {
        showToast("Nothing to copy!", true);
        return;
      }
      await navigator.clipboard.writeText(codeEditor.value);
      showToast("Code copied to clipboard!");
    });

    // Paste from clipboard
    document.getElementById("pasteBtn").addEventListener("click", async () => {
      try {
        const text = await navigator.clipboard.readText();
        codeEditor.value = text;
        updateStats();
        showToast("Pasted code from clipboard!");
      } catch (err) {
        showToast("Please allow clipboard access or use Ctrl+V / Cmd+V", true);
      }
    });

    // Clear editor
    document.getElementById("clearBtn").addEventListener("click", () => {
      codeEditor.value = "";
      updateStats();
      showToast("Editor cleared");
    });

    // Initial render
    renderFileTree();
  </script>
</body>
</html>
